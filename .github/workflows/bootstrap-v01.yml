name: Bootstrap JevHub V0.1

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-v01.yml"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct V0.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* | base64 --decode | tar -xzf -
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-v01.yml
          npm pkg delete overrides
          sed -i 's/import { useMemo, useRef, useState } from "react";/import { useRef, useState } from "react";/' src/components/calculator/jev-cost-calculator.tsx
          python -c 'from pathlib import Path; p=Path("src/components/calculator/jev-cost-calculator.tsx"); s=p.read_text(); a=s.index("  const result = useMemo("); b=s.index("\\n\\n  function setPreset", a); n="  const result = calculateJevCost({\\n    averageInputTokens: averageTokens,\\n    requests,\\n    mode,\\n    pricePerMillionInputTokens: JEV_PRICING.pricePerMillionInputTokens,\\n  });"; p.write_text(s[:a]+n+s[b:])'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Quality gate
        run: npm run check

      - name: Commit verified V0.1 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement JevHub V0.1"
          git push origin HEAD:main
