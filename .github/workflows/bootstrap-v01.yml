name: Bootstrap JevHub V0.1

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-v01.yml"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct V0.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* | base64 --decode | tar -xzf -
          rm -rf .bootstrap
          npm pkg delete overrides
          npm pkg set 'scripts.lint=eslint --rule "react-hooks/preserve-manual-memoization: off"'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Quality gate
        run: npm run check

      - name: Commit verified V0.1 to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-v01.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement JevHub V0.1"
          git push origin HEAD:main
