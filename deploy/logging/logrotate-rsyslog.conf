# Capacity-first diagnostic retention. Existing rsyslog reopen mechanism.
/var/log/syslog {
    daily
    maxsize 8M
    rotate 3
    maxage 14
    missingok
    notifempty
    compress
    sharedscripts
    postrotate
        /usr/lib/rsyslog/rsyslog-rotate
    endscript
}
/var/log/auth.log {
    daily
    maxsize 4M
    rotate 3
    maxage 14
    missingok
    notifempty
    compress
    sharedscripts
    postrotate
        /usr/lib/rsyslog/rsyslog-rotate
    endscript
}
/var/log/mail.log
/var/log/mail.err
/var/log/kern.log
/var/log/user.log
/var/log/cron.log {
    daily
    maxsize 1M
    rotate 3
    maxage 14
    missingok
    notifempty
    compress
    sharedscripts
    postrotate
        /usr/lib/rsyslog/rsyslog-rotate
    endscript
}
