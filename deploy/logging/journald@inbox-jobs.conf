# InboxRevamp scheduled-task output; separate from Web and system/security logs.
[Journal]
Storage=persistent
Compress=yes
SplitMode=none
SystemMaxUse=96M
SystemMaxFileSize=4M
SystemKeepFree=2G
RuntimeMaxUse=8M
RuntimeMaxFileSize=1M
MaxRetentionSec=14day
MaxFileSec=1day
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
ReadKMsg=no
