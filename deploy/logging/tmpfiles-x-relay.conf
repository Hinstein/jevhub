# Existing Python RotatingFileHandler bounds size; expire closed archives by
# mtime using the system's existing tmpfiles timer. Never unlink active bases.
# This directory must remain diagnostic-log-only; no DB, sessions or env files.
e /home/ubuntu/x-telegram-push/logs - - - mM:14d -
x /home/ubuntu/x-telegram-push/logs/*.log - - - - -
x /home/ubuntu/x-telegram-push/logs/.gitkeep - - - - -
x /home/ubuntu/x-telegram-push/logs/*.db* - - - - -
x /home/ubuntu/x-telegram-push/logs/.env* - - - - -
