# Logger uses fs.appendFile(path) per write, so rename/create needs no restart.
# Do not use copytruncate: this Bot also reports delivery failures.
/home/ubuntu/GoofishCredentialsBot/logs/*/*.log {
    daily
    maxsize 1M
    rotate 3
    maxage 14
    ifempty
    missingok
    compress
    delaycompress
    create 0640 ubuntu ubuntu
    su ubuntu ubuntu
}
