# Local business log storage; no external log forwarding.
[Journal]
Storage=persistent
Compress=yes
SplitMode=none
SystemMaxUse=48M
SystemMaxFileSize=4M
SystemKeepFree=2G
RuntimeMaxUse=4M
RuntimeMaxFileSize=1M
MaxRetentionSec=14day
MaxFileSec=1day
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
ReadKMsg=no
