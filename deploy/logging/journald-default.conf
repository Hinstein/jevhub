# System/security and PID 1 records only after business migration.
[Journal]
Storage=persistent
Compress=yes
SplitMode=none
SystemMaxUse=128M
SystemMaxFileSize=8M
SystemKeepFree=2G
RuntimeMaxUse=16M
RuntimeMaxFileSize=2M
MaxRetentionSec=14day
MaxFileSec=1day
# Keep the existing authentication/syslog file delivery intact.
ForwardToSyslog=yes
